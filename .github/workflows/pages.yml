name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

# Permissions nécessaires pour que la pipeline puisse déployer sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Préparer les fichiers (Upload artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # On déploie le dossier racine contenant index.html
          
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4