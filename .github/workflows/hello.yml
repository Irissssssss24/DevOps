name: Hello World Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Dire bonjour
        run: echo "Hello World"

  afficher-nom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le nom
        run: echo "Nom = ${{ vars.NOM }}"

  afficher-prenom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le prénom
        run: echo "Prénom = ${{ vars.PRENOM }}"

  afficher-email:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher l'email
        run: echo "Email = ${{ vars.EMAIL }}"